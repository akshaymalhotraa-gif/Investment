[project]
name = "healthlog"
version = "0.1.0"
description = "Log food and exercise to the Google Health API from the terminal or from Claude"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
healthlog = "healthlog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["healthlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
